<main class="min-h-screen bg-[radial-gradient(ellipse_at_9%_0%,rgba(229,239,255,0.6),transparent_34rem),#f5f7fb] text-slate-700">
  <app-header />
  <div class="mx-auto max-w-[1260px] px-3.5 pt-[19px] pb-[22px] sm:px-7 sm:pt-[31px]">
    <div class="mb-5 flex flex-col items-start justify-between gap-3 sm:flex-row sm:items-end">
      <div>
        <p class="mb-1.5 text-[8px] font-bold tracking-[1.05px] text-slate-500">WELCOME DESK</p>
        <h1 class="m-0 text-[26px] font-bold tracking-[-1px] text-slate-800 sm:text-[31px]">Visitor management</h1>
        <p class="mb-0 mt-1.5 text-[11px] text-slate-500">Register guests and keep their visit status up to date.</p>
      </div>
      <div class="flex items-center gap-[9px] rounded-lg border border-slate-200 bg-white px-[11px] py-2">
        <span class="grid size-[27px] place-items-center rounded-lg bg-blue-50 text-sm text-blue-700" aria-hidden="true">▦</span>
        <span><strong class="block text-[9px] font-bold text-slate-600">Front desk</strong><small class="mt-0.5 block text-[8px] text-slate-400">Visitor check-in</small></span>
      </div>
    </div>

    <div *ngIf="submissionMessage" class="mb-[14px] flex items-center gap-[9px] rounded-lg border border-emerald-200 bg-emerald-50 px-3 py-2.5 text-[10px] text-emerald-800" role="status">
      <span class="text-[13px] font-extrabold" aria-hidden="true">✓</span>
      {{ submissionMessage }}
      <button type="button" class="ml-auto grid size-[22px] place-items-center rounded text-[17px] hover:bg-emerald-100 focus-visible:outline-2 focus-visible:outline-emerald-600"
        aria-label="Dismiss registration message" (click)="submissionMessage = ''">×</button>
    </div>

    <div class="grid grid-cols-1 items-start gap-[17px] lg:grid-cols-[minmax(320px,0.88fr)_minmax(510px,1.55fr)]">
      <app-visitor-registration-wizard
        [step]="step" [formData]="formData" [hostQuery]="hostQuery"
        [nameError]="nameError" [contactError]="contactError"
        [stepOneValid]="stepOneValid" [stepTwoValid]="stepTwoValid" [stepTwoTouched]="stepTwoTouched"
        [selectedHost]="selectedHost"
        (nameChange)="updateForm('name', $event); nameTouched = true"
        (contactChange)="updateForm('contact', $event); contactTouched = true"
        (purposeChange)="updateForm('purpose', $event); stepTwoTouched = true"
        (hostQueryChange)="updateHostQuery($event)"
        (hostSelect)="selectHost($event.id)"
        (continueStep)="continueWizard()"
        (back)="back()"
        (editVisitor)="step = 1"
        (editVisit)="step = 2"
        (submitVisit)="submitVisit()" />
      <app-visitor-board [visits]="visits" (transitionVisit)="transitionVisit($event)" />
    </div>

    <footer class="mt-[18px] flex flex-col gap-2 text-[8px] text-slate-400 sm:flex-row sm:justify-between">
      <span>Frontdesk <span class="px-[3px]" aria-hidden="true">·</span> Visitor management</span>
      <span>Visitor information stays in this session</span>
    </footer>
  </div>
</main>
